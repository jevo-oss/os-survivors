<title>Old School Survivors</title>
<style>
:root{--gold:#d9a537;--ink:#0b0806;--parch:#f4e6c0}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#120c18;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh;touch-action:none}
#sat{position:fixed;top:0;height:env(safe-area-inset-top);width:1px;pointer-events:none}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,rgba(20,12,30,.25),rgba(10,6,16,.7));font-family:"Trebuchet MS",system-ui,sans-serif;z-index:5;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);box-sizing:border-box;overflow-y:auto;touch-action:pan-y}
.panel{position:relative;background:linear-gradient(180deg,rgba(74,59,41,.94),rgba(42,31,20,.94) 60%,rgba(33,24,15,.96));-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);border:2px solid var(--ink);box-shadow:inset 0 0 0 1px rgba(214,170,90,.55),inset 0 1px 0 2px rgba(255,230,170,.08),0 18px 50px rgba(0,0,0,.7);border-radius:16px;padding:14px;width:min(92vw,400px);color:var(--parch);text-align:center;margin:auto;box-sizing:border-box}
.panel:before,.panel:after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--gold);transform:rotate(45deg);background:#2a1f14;top:-9px}
.panel:before{left:calc(50% - 9px)}.panel:after{display:none}
h1,h2{margin:4px 0 8px;font-weight:900;letter-spacing:.5px;color:#ffcf6a;text-shadow:0 2px 0 #3a1e00,0 0 18px rgba(255,170,60,.35)}
h2{font-size:22px}
.logo{font-size:34px;line-height:1;margin:6px 0 2px;background:linear-gradient(#fff3c0,#ffb02e 55%,#b85c00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #3a1e00) drop-shadow(0 0 14px rgba(255,160,40,.45));font-weight:900;letter-spacing:1px}
.sub{font-size:12px;color:#c9b58a;letter-spacing:3px;text-transform:uppercase;margin-bottom:10px}
p{margin:6px 0;font-size:13px;color:#e8dcc0}
.btn{display:block;width:100%;margin:8px 0 0;padding:13px;border-radius:12px;border:2px solid var(--ink);background:linear-gradient(#ffcf6a,#d18a1a 55%,#a5600a);color:#2a1400;font:900 17px "Trebuchet MS",system-ui;letter-spacing:.5px;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(0,0,0,.25),0 4px 0 #3a2200,0 8px 18px rgba(0,0,0,.4);text-shadow:0 1px 0 rgba(255,240,200,.6)}
.btn:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 2px 0 #3a2200}
.btn.sec{background:linear-gradient(#5e4c34,#3a2c1c);color:var(--parch);text-shadow:0 1px 0 #000;font-size:14px;padding:10px}
.row{display:flex;gap:8px}.row>*{flex:1}
.classes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.cls{position:relative;border:2px solid var(--ink);border-radius:12px;background:linear-gradient(#3a2d1e,#211810);padding:6px 6px 8px;box-shadow:inset 0 0 0 1px rgba(214,170,90,.3);color:var(--parch);font:inherit;text-align:left;overflow:hidden}
.cls.sel{box-shadow:inset 0 0 0 2px #ffcf6a,0 0 16px rgba(255,190,80,.5);background:linear-gradient(#57432a,#2a1f14)}
.cls img.por{width:44px;height:52px;float:left;margin-right:6px;filter:drop-shadow(1px 2px 1px rgba(0,0,0,.6))}
.cls b{display:block;font-size:14px;color:#ffcf6a}.cls i{font-style:normal;font-size:10px;color:#c9b58a;display:block}
.cls .lv{font-size:11px;color:#fff}.cls img.wi{position:absolute;right:5px;top:5px;width:22px;height:22px}
.xpb{clear:both;height:7px;border-radius:4px;background:#120c08;border:1px solid rgba(214,170,90,.6);overflow:hidden;margin-top:5px}
.xpb>div{height:100%;background:linear-gradient(#a6ecff,#2a7ad0);box-shadow:inset 0 1px 0 rgba(255,255,255,.5);transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.perks{display:flex;justify-content:space-between;align-items:flex-start;margin:8px 2px 4px;position:relative}
.perks:before{content:"";position:absolute;left:14px;right:14px;top:13px;height:3px;background:#120c08;border-radius:2px}
.pk{position:relative;width:19%;font-size:9px;color:#a8977a;line-height:1.15}
.pk .n{width:26px;height:26px;margin:0 auto 3px;border-radius:50%;border:2px solid var(--ink);background:#2a2016;display:flex;align-items:center;justify-content:center;font:900 11px system-ui;color:#8a7a5a;box-shadow:inset 0 0 0 1px rgba(214,170,90,.35)}
.pk.on{color:#f4e6c0}.pk.on .n{background:radial-gradient(circle at 35% 30%,#fff0b0,#d9a537 60%,#7a5000);color:#2a1400;box-shadow:0 0 10px rgba(255,200,80,.6)}
.pk.sig .n{border-radius:7px;transform:rotate(45deg)}.pk.sig .n span{transform:rotate(-45deg)}
.blurb{font-size:12px;color:#e8dcc0;background:rgba(0,0,0,.25);border-radius:8px;padding:6px;margin:4px 0}
.gold{color:#ffd24a;font-weight:900}
/* level up cards */
.card{position:relative;display:flex;align-items:center;gap:10px;width:100%;margin:9px 0;padding:10px 10px 10px 8px;border-radius:12px;border:2px solid var(--ink);color:var(--parch);font:inherit;text-align:left;background:linear-gradient(100deg,rgba(var(--tc),.22),rgba(30,22,14,.95) 45%),linear-gradient(#3e3020,#1e160e);box-shadow:inset 0 0 0 1.5px rgba(var(--tc),.9),inset 0 0 22px rgba(var(--tc),.18),0 0 calc(var(--tg)*1px) rgba(var(--tc),.55),0 6px 14px rgba(0,0,0,.45);overflow:hidden;animation:cin .35s both}
.card:nth-child(2){animation-delay:.07s}.card:nth-child(3){animation-delay:.14s}
@keyframes cin{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.card:active{transform:scale(.98)}
.card img{width:52px;height:52px;flex:none;filter:drop-shadow(0 0 6px rgba(var(--tc),.6))}
.card .t{flex:1;font-size:14px;font-weight:800;line-height:1.25}.card small{display:block;font-weight:400;font-size:11.5px;color:#d8ccb0;margin-top:3px}
.card .lvl{display:inline-block;margin-top:3px;font-size:11px;font-weight:900;color:#fff;background:rgba(0,0,0,.45);border:1px solid rgba(var(--tc),.7);border-radius:6px;padding:1px 6px}
.gem{position:absolute;right:8px;top:7px;display:flex;align-items:center;gap:5px;font-size:9px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:rgb(var(--tc))}
.gem i{width:9px;height:9px;transform:rotate(45deg);background:linear-gradient(135deg,#fff,rgb(var(--tc)) 45%,rgba(0,0,0,.6));border:1px solid var(--ink);box-shadow:0 0 6px rgb(var(--tc))}
.card.mega:after{content:"";position:absolute;inset:-40%;background:linear-gradient(105deg,transparent 40%,rgba(255,230,160,.35) 50%,transparent 60%);animation:sheen 2.2s infinite}
@keyframes sheen{from{transform:translateX(-60%)}to{transform:translateX(60%)}}
.slots{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;margin:4px 0}.slots img,.slots .em{width:30px;height:30px;border-radius:7px}.slots .em{border:1px dashed rgba(214,170,90,.4);background:rgba(0,0,0,.35);box-sizing:border-box}
.slots .lab{width:100%;font-size:10px;color:#c9b58a;letter-spacing:1px;text-transform:uppercase}
/* chest */
.reel{width:84px;height:84px;margin:10px auto;border-radius:16px;border:2px solid var(--ink);background:radial-gradient(#4a3b29,#120c08);box-shadow:inset 0 0 0 2px #ffcf6a,0 0 30px rgba(255,190,80,.6);display:flex;align-items:center;justify-content:center}
.reel img{width:68px;height:68px}
.won{display:flex;align-items:center;gap:8px;text-align:left;font-size:13px;background:rgba(0,0,0,.3);border-radius:10px;padding:6px;margin:5px 0;animation:cin .3s both}.won img{width:36px;height:36px}
/* end screen */
.stat{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:8px 0}.stat div{background:rgba(0,0,0,.3);border-radius:8px;padding:6px 2px;font-size:10px;color:#c9b58a;text-transform:uppercase;letter-spacing:1px}.stat b{display:block;font-size:17px;color:#fff;letter-spacing:0}
.lvup{margin:8px 0;padding:8px;border-radius:10px;background:linear-gradient(90deg,rgba(255,190,60,.1),rgba(255,190,60,.3),rgba(255,190,60,.1));border:1px solid #ffcf6a;color:#ffe9a8;font-weight:900;animation:pulse 1s infinite alternate}
@keyframes pulse{to{box-shadow:0 0 22px rgba(255,200,80,.7)}}
.conf{position:fixed;top:-12px;width:8px;height:12px;z-index:9;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.shopi{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.28);border-radius:10px;padding:6px;margin:6px 0;text-align:left;font-size:13px}.shopi img{width:34px;height:34px}.shopi .t{flex:1}.shopi small{display:block;color:#c9b58a;font-size:11px}
.shopi button{border:2px solid var(--ink);border-radius:8px;background:linear-gradient(#ffcf6a,#b8700a);font:900 12px system-ui;padding:7px 8px;color:#2a1400;min-width:64px}.shopi button:disabled{filter:grayscale(1) brightness(.6)}
.pbtn{position:fixed;top:calc(env(safe-area-inset-top) + 10px);right:10px;width:50px;height:50px;z-index:4;display:none;border-radius:14px;border:2px solid var(--ink);background:linear-gradient(#4a3b29,#21180f);box-shadow:inset 0 0 0 1px rgba(214,170,90,.7),0 6px 14px rgba(0,0,0,.5);padding:0;touch-action:manipulation}
.pbtn:before,.pbtn:after{content:"";position:absolute;top:15px;width:6px;height:18px;border-radius:2px;background:linear-gradient(#fff3c0,#d9a537);box-shadow:0 1px 0 #3a1e00}.pbtn:before{left:15px}.pbtn:after{right:15px}
.pbtn:active{transform:scale(.94)}
.btn.danger{background:linear-gradient(#a8443a,#6a1e16);color:#ffe9d8;text-shadow:0 1px 0 #000;font-size:14px;padding:10px}
.cont small{display:block;font:600 11px "Trebuchet MS",system-ui;opacity:.75;margin-top:2px}
.pips{letter-spacing:2px;color:#ffcf6a;font-size:10px}
</style></head><body>
<div id="sat"></div>
<canvas id="c"></canvas>
<div class="ov" id="menu"><div class="panel">
 <div class="logo">Old School Survivors</div><div class="sub">· choose your path ·</div>
 <div class="classes" id="classes"></div>
 <div class="blurb" id="blurb"></div>
 <div class="perks" id="perks"></div>
 <div class="row"><button class="btn sec" id="shopBtn">Shop · <span class="gold" id="gold"></span></button></div>
 <button class="btn cont" id="contBtn" style="display:none">Continue run<small id="contInfo"></small></button>
 <button class="btn" id="startBtn">Play</button>
 <p id="best" style="font-size:11px;color:#a8977a;margin-top:8px"></p>
</div></div>
<div class="ov" id="shop"><div class="panel"><h2>Wise Old Shop</h2><p>Permanent upgrades for every class. <span class="gold" id="gold2"></span></p><div id="shopList"></div><button class="btn sec" id="shopBack">Back</button></div></div>
<div class="ov" id="lvl"><div class="panel"><h2>Level up!</h2><div class="slots" id="slotinfo"></div><div id="choices"></div></div></div>
<div class="ov" id="chest"><div class="panel"><h2>Treasure chest</h2><div class="reel"><img id="reelImg" alt=""></div><div id="chestWon"></div><button class="btn" id="chestBtn" style="display:none">Collect</button></div></div>
<button class="pbtn" id="pauseBtn" aria-label="Pause"></button>
<div class="ov" id="pause"><div class="panel"><h2>Paused</h2><div class="stat" id="pstats"></div><div class="slots" id="pslots"></div>
 <button class="btn" id="resumeBtn">Resume</button><button class="btn sec" id="saveQuitBtn">Save &amp; Quit</button><button class="btn danger" id="quitBtn">Quit run</button>
 <div id="quitConfirm" style="display:none"><p>Abandon this run? Progress, class XP and gold from it are lost.</p><div class="row"><button class="btn sec" id="quitNo">Keep playing</button><button class="btn danger" id="quitYes">Abandon</button></div></div></div></div>
<div class="ov" id="over"><div class="panel"><h2 id="overT">Oh dear, you are dead!</h2><div class="stat" id="stats"></div><div id="cxp"></div><p id="skillsum" style="font-size:11px;color:#c9b58a"></p><div class="row"><button class="btn sec" id="menuBtn">Menu</button><button class="btn" id="againBtn">Play again</button></div></div></div>
<script>
(()=>{
'use strict';
// ================= ART: cohesive shaded vector sprites (original), pre-rendered once =================
if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(r,w/2,h/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath()}}
const SS=Math.max(1.5,Math.min(2,window.devicePixelRatio||1)); // sprite supersample = canvas DPR so sprites blit 1:1
const hx=c=>{c=c.replace('#','');if(c.length===3)c=c.split('').map(x=>x+x).join('');const n=parseInt(c,16);return[n>>16&255,n>>8&255,n&255]};
const mix=(a,b,t)=>{const A=hx(a),B=hx(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')};
const LIGHT='#fff4d6',SHADE='#1b1226',RIM='#a9d4ff';           // warm key light from top-left, cool violet shadows, cool rim
const lt=(c,t)=>mix(c,LIGHT,t),dk=(c,t)=>mix(c,SHADE,t);
function mk(w,h,fn){const c=document.createElement('canvas');c.width=Math.ceil(w*SS);c.height=Math.ceil(h*SS);const g=c.getContext('2d');g.scale(SS,SS);g.lineJoin='round';g.lineCap='round';fn(g,w,h);
 const f=document.createElement('canvas');f.width=c.width;f.height=c.height;const fg=f.getContext('2d');fg.drawImage(c,0,0);fg.globalCompositeOperation='source-atop';fg.fillStyle='#fff';fg.fillRect(0,0,f.width,f.height);return{c,f,w,h}}
// The one shading model every sprite uses: TL->BR gradient, AO core, key highlight edge (TL), cool rim edge (BR), tinted outline.
function shade(g,path,base,bb,o){o=o||{};const[x,y,w,h]=bb;
 path(g);const q=g.createLinearGradient(x,y,x+w*.55,y+h);q.addColorStop(0,lt(base,o.hi??.3));q.addColorStop(.55,base);q.addColorStop(1,dk(base,o.lo??.42));g.fillStyle=q;g.fill();
 g.save();path(g);g.clip();
 const r=g.createRadialGradient(x+w*.9,y+h*1.05,0,x+w*.9,y+h*1.05,Math.max(w,h)*.9);r.addColorStop(0,'rgba(27,18,38,.38)');r.addColorStop(1,'rgba(27,18,38,0)');g.fillStyle=r;g.fillRect(x-3,y-3,w+6,h+6);
 if(o.spec!==0){const s=g.createRadialGradient(x+w*.3,y+h*.22,0,x+w*.3,y+h*.22,Math.max(w,h)*.42);s.addColorStop(0,`rgba(255,250,230,${o.spec??.32})`);s.addColorStop(1,'rgba(255,250,230,0)');g.fillStyle=s;g.fillRect(x-3,y-3,w+6,h+6)}
 g.translate(1,1.1);path(g);g.strokeStyle=lt(base,.62);g.globalAlpha=.7;g.lineWidth=1.3;g.stroke();
 g.translate(-2.2,-2.3);path(g);g.strokeStyle=RIM;g.globalAlpha=o.rim??.3;g.lineWidth=1.5;g.stroke();
 g.restore();path(g);g.strokeStyle=o.ol||dk(base,.78);g.lineWidth=o.lw||1.25;g.stroke()}
const pE=(x,y,rx,ry,rot)=>g=>{g.beginPath();g.ellipse(x,y,rx,ry,rot||0,0,6.283)};
const pR=(x,y,w,h,r)=>g=>{g.beginPath();g.roundRect(x,y,w,h,r)};
const pP=a=>g=>{g.beginPath();g.moveTo(a[0],a[1]);for(let i=2;i<a.length;i+=2)g.lineTo(a[i],a[i+1]);g.closePath()};
const bbP=a=>{let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(let i=0;i<a.length;i+=2){x0=Math.min(x0,a[i]);x1=Math.max(x1,a[i]);y0=Math.min(y0,a[i+1]);y1=Math.max(y1,a[i+1])}return[x0,y0,x1-x0,y1-y0]};
const E=(g,x,y,rx,ry,c,o,rot)=>shade(g,pE(x,y,rx,ry,rot),c,[x-rx,y-ry,rx*2,ry*2],o);
const RR=(g,x,y,w,h,r,c,o)=>shade(g,pR(x,y,w,h,r),c,[x,y,w,h],o);
const PL=(g,a,c,o)=>shade(g,pP(a),c,bbP(a),o);
const pC=(x1,y1,x2,y2,r)=>g=>{const a=Math.atan2(y2-y1,x2-x1);g.beginPath();g.arc(x2,y2,r,a-Math.PI/2,a+Math.PI/2);g.arc(x1,y1,r,a+Math.PI/2,a+Math.PI*1.5);g.closePath()};
const CAP=(g,x1,y1,x2,y2,r,c,o)=>shade(g,pC(x1,y1,x2,y2,r),c,[Math.min(x1,x2)-r,Math.min(y1,y2)-r,Math.abs(x2-x1)+2*r,Math.abs(y2-y1)+2*r],o);
const dot=(g,x,y,r,c)=>{g.beginPath();g.arc(x,y,r,0,6.283);g.fillStyle=c;g.fill()};
const glw=(g,x,y,r,c,a)=>{const q=g.createRadialGradient(x,y,0,x,y,r);q.addColorStop(0,c);q.addColorStop(1,'rgba(0,0,0,0)');g.globalAlpha=a??1;g.fillStyle=q;g.beginPath();g.arc(x,y,r,0,6.283);g.fill();g.globalAlpha=1};
const eye=(g,x,y,r,c)=>{dot(g,x,y,r,c||'#16101a');dot(g,x-r*.35,y-r*.4,r*.38,'rgba(255,255,255,.9)')};
const strokeP=(g,fn,c,w)=>{fn(g);g.strokeStyle=c;g.lineWidth=w;g.stroke()};
// palette
const PAL={rune:'#4f93a0',runeD:'#2f5f6a',bronze:'#b8743a',iron:'#8a9098',steel:'#a9b2bb',gold:'#d9a537',leather:'#6b4426',wood:'#7a5130',cape:'#9e2b25',
 skin:'#e0ae86',gob:'#79a640',bone:'#e9e1c6',cow:'#f1ece0',rat:'#7c7266',drag:'#2f2b36',ice:'#8fd3ff',mega:'#ffa21a'};

// ---------- player classes (2 walk frames each) ----------
function humanoid(g,f,o){ // f = -1/1 stride
 const L=o.leg,cx=24;
 // cape / back layer
 if(o.cape)PL(g,[14,22,34,22,37,47,24,50,11,47],o.cape,{hi:.15,lo:.5});
 // back arm
 CAP(g,13,25,10+f,35,3.3,dk(o.arm,.15));
 // legs
 CAP(g,20,36,20+f*2.5,47,3.6,L);CAP(g,28,36,28-f*2.5,47,3.6,dk(L,.1));
 E(g,20.5+f*2.5,49,4.6,2.4,o.boot);E(g,28.5-f*2.5,49,4.6,2.4,dk(o.boot,.1));
 // torso
 if(o.robe)PL(g,[15,21,33,21,36,46,12,46],o.body,{hi:.25});else PL(g,[13,21,35,21,33,38,15,38],o.body);
 if(o.trim){strokeP(g,g=>{g.beginPath();g.moveTo(24,22);g.lineTo(24,o.robe?45:37)},o.trim,1.6)}
 RR(g,15,o.robe?33:35,18,3.5,1.5,o.belt||PAL.leather,{spec:0});dot(g,24,o.robe?34.7:36.7,1.4,PAL.gold);
 if(o.pauld){E(g,14,23,5,4,o.pauld);E(g,34,23,5,4,o.pauld)}
 // head
 o.head(g);
 // front arm + weapon
 o.weapon&&o.weapon(g,f);
 CAP(g,35,25,38-f*.5,34,3.3,o.arm);E(g,38-f*.5,35,2.6,2.6,o.hand||PAL.skin,{spec:0});
}
const CLASS_LOOK={
 warrior:f=>mk(48,56,g=>humanoid(g,f,{leg:PAL.rune,boot:'#3a2618',cape:PAL.cape,arm:PAL.rune,hand:PAL.runeD,body:PAL.rune,trim:lt(PAL.rune,.5),pauld:lt(PAL.rune,.08),

const SAVE_KEY='oss_run';
const SAVE_FIELDS=['cls','t','kills','lvl','xp','next','gold','w','pas','mega','cd','spawnT','bossNext','eliteNext','swarmNext','propT','megaGuar','megaDrops','revived','runXp','loot'];
function saveRun(){if(!running||!G||G.over||G.menu)return false;const o={v:1,at:Date.now()};SAVE_FIELDS.forEach(k=>o[k]=JSON.parse(JSON.stringify(G[k])));
 o.p={x:G.p.x,y:G.p.y,hp:G.p.hp,face:G.p.face,star:Math.max(0,G.p.star)};o.cannons=G.cannons.map(c=>({x:c.x,y:c.y,life:c.life}));saveSkills();LS.set(SAVE_KEY,o);return true}
const hasRun=()=>{const r=LS.get(SAVE_KEY,null);return r&&r.v===1?r:null};
function clearRun(){try{localStorage.removeItem(SAVE_KEY)}catch(_){}}
function continueRun(){const r=hasRun();if(!r)return start();META.cls=r.cls;saveMeta();newGame();
 SAVE_FIELDS.forEach(k=>{if(r[k]!==undefined)G[k]=r[k]});Object.assign(G.p,{x:r.p.x,y:r.p.y,face:r.p.face||[1,0],star:r.p.star||0});G.p.max=hpMax();G.p.hp=Math.min(G.p.max,r.p.hp);
 G.cannons=(r.cannons||[]).map(c=>({x:c.x,y:c.y,life:c.life,ft:0,ang:0,fl:-9}));clearRun();
 ['menu','over','lvl','chest','shop','pause'].forEach(id=>show(id,0));running=true;last=performance.now();$('pauseBtn').style.display='block';G.banner={txt:'Run restored · '+fmtT(G.t),life:2,col:'#ffcf6a'}}
function pauseGame(){if(!running||!G||G.over)return;G.hold=true;$('quitConfirm').style.display='none';['quitBtn','saveQuitBtn','resumeBtn'].forEach(id=>$(id).style.display='block');
 $('pstats').innerHTML=`<div>Time<b>${fmtT(G.t)}</b></div><div>Level<b>${G.lvl}</b></div><div>Kills<b>${G.kills}</b></div>`;$('pslots').innerHTML=slotsHtml();show('pause',1)}
function resumeGame(){show('pause',0);if(G){G.hold=false;last=performance.now()}}
function toMenu(){running=false;$('pauseBtn').style.display='none';['pause','lvl','chest','over'].forEach(id=>show(id,0));buildMenu();menuScene();show('menu',1)}
$('pauseBtn').onclick=e=>{e.stopPropagation();pauseGame()};$('resumeBtn').onclick=resumeGame;
$('saveQuitBtn').onclick=()=>{saveRun();toMenu()};
$('quitBtn').onclick=()=>{$('quitConfirm').style.display='block';['quitBtn','saveQuitBtn','resumeBtn'].forEach(id=>$(id).style.display='none')};
$('quitNo').onclick=()=>{$('quitConfirm').style.display='none';['quitBtn','saveQuitBtn','resumeBtn'].forEach(id=>$(id).style.display='block')};
$('quitYes').onclick=()=>{clearRun();saveSkills();toMenu()};
$('contBtn').onclick=continueRun;
addEventListener('keydown',e=>{if((e.key==='Escape'||e.key==='p')&&running&&G&&!G.over){if(G.hold)resumeGame();else if(!G.paused)pauseGame()}});
const autoSave=()=>{if(running&&G&&!G.over){saveRun();if(!G.hold&&!G.paused)pauseGame();else G.hold=true}};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')autoSave()});
addEventListener('pagehide',autoSave);
$('startBtn').onclick=start;$('againBtn').onclick=start;$('menuBtn').onclick=()=>{show('over',0);buildMenu();menuScene();show('menu',1)};
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 if(running&&!G.paused&&!G.hold&&!G.over)update(dt);
 else if(G&&G.menu){G.p.moving=true;for(const q of parts.a)if(q.a){q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;if(q.life<=0)q.a=false}for(const l of G.loot)if(l.tier&&Math.random()<dt*(2+l.tier*2))rise(l.x,l.y,GL[TIERS[l.tier].gl],3+l.tier)}
 if(G){if(G.menu)renderMenu();else render()}requestAnimationFrame(loop)}
function renderMenu(){render()}
// ================= INIT =================
menuScene();buildMenu();show('menu',1);requestAnimationFrame(loop);
window.__game={dropMega,update:dt=>update(dt),grantMega,levelUp,get G(){return G},gainXp,start,SK,XPT,sLvl,META,clsInfo,gameOver,collect,dropItem,needFor,spawn,openChest,computeBonus,buildMenu,menuScene,render,DBG,saveRun,continueRun,pauseGame,resumeGame,hasRun};
})();
</script></body></html>
