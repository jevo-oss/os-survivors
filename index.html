<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Old School Survivors</title>
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh;touch-action:none}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);font-family:Verdana,Arial,sans-serif;z-index:5}
.panel{background:#4a3f30;border:4px solid #2a2218;box-shadow:inset 0 0 0 2px #7a6a4f;border-radius:6px;padding:16px;width:min(88vw,380px);color:#ff0;text-shadow:1px 1px 0 #000;text-align:center}
.panel h1{margin:4px 0 10px;font-size:24px;color:#ff981f}.panel p{color:#fff;font-size:14px;margin:6px 0}
.btn{display:block;width:100%;margin:8px 0;padding:12px;background:#5e5140;border:2px solid #2a2218;box-shadow:inset 0 0 0 1px #8b7a5c;color:#ff0;text-shadow:1px 1px 0 #000;font:bold 15px Verdana,sans-serif;border-radius:4px;text-align:left}
.btn small{display:block;color:#fff;font-weight:normal;font-size:12px;margin-top:3px}
.btn:active{background:#7a6a4f}
</style></head><body>
<canvas id="c"></canvas>
<div class="ov" id="menu"><div class="panel"><h1>Old School Survivors</h1><p>Survive the hordes of Gielinor-ish lands.</p><p>Touch &amp; drag anywhere to move.<br>Desktop: WASD / arrows.</p><p id="best"></p><button class="btn" id="startBtn" style="text-align:center">Play</button></div></div>
<div class="ov" id="lvl"><div class="panel"><h1>Level up!</h1><p>Choose a reward:</p><div id="choices"></div></div></div>
<div class="ov" id="over"><div class="panel"><h1>Oh dear, you are dead!</h1><p id="stats"></p><button class="btn" id="againBtn" style="text-align:center">Try again</button></div></div>
<script>
(()=>{
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);ctx.imageSmoothingEnabled=false;}
addEventListener('resize',resize);resize();
// block zoom/scroll
['gesturestart','gesturechange','dblclick','contextmenu'].forEach(e=>document.addEventListener(e,ev=>ev.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.target===cv)e.preventDefault()},{passive:false});
let lastTouch=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTouch<300&&e.target===cv)e.preventDefault();lastTouch=n},{passive:false});

// ---------- sprites (original pixel art, drawn from strings) ----------
function sprite(rows,pal,s){const h=rows.length,w=rows[0].length,c=document.createElement('canvas');c.width=w*s;c.height=h*s;const g=c.getContext('2d');
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const ch=rows[y][x];if(ch!=='.'&&pal[ch]){g.fillStyle=pal[ch];g.fillRect(x*s,y*s,s,s)}}return c;}
const SPR={
 player:sprite(["...hhhh...","..hHHHHh..","..hfffFh..","..hfeFeh..","...ffff...",".aAAAAAAa.","aAAsAAsAAa","fAAAAAAAAf","f.AAAAAA.f","..LLLLLL..","..LL..LL..","..LL..LL..",".bbb..bbb."],
  {h:'#2e6f8e',H:'#4fa3c4',f:'#e0b48a',F:'#c99a70',e:'#222',a:'#2b6f8c',A:'#3d8fb0',s:'#9fd6ea',L:'#356a80',b:'#3a2a1a'},3),
 chicken:sprite(["...rr...","..wwww..",".wwwwek.","wwwwwww.","wwwwww..",".wwwww..","..y..y.."],{r:'#d22',w:'#f2f2f2',e:'#000',k:'#f4b400',y:'#f4b400'},3),
 rat:sprite(["........ee.",".gggggggggn","ggggggggggg","gggggggggg.",".g..g..g...","t.........."],{g:'#6b6b5e',e:'#c66',n:'#e99',t:'#c99'},3),
 goblin:sprite(["e.gggg.e","eggggggge".slice(0,8),".gkggkg.",".gggggg.","..gmmg..",".bbbbbb.","gbbbbbbg","..bb.bb.","..gg.gg."],{e:'#5a8a2a',g:'#6fa83a',k:'#000',m:'#3a1a0a',b:'#7a5230'},3),
 cow:sprite(["hh......hh",".wwwwwwww.","wwkkwwwwkw","wwwwwkkwww","wkkwwwwwww","wwwwwwwwpp",".l.l..l.l.",".l.l..l.l."],{h:'#ddd',w:'#f5f5f0',k:'#222',p:'#f0a0a0',l:'#555'},3),
 skeleton:sprite(["..wwww..",".wkwwkw.",".wwwwww.","..wkkw..","...ww...",".wwwwww.","w.wwww.w","w.w..w.w","..w..w..",".ww..ww."],{w:'#e8e4d0',k:'#111'},3),
 dragon:sprite(["k..........k..","kk...kkk..kk..",".kk.kkrkk.kk..","..kkkkkkkkk...",".kkkkkkkkkkkk.","kkkkkkkkkkkkkk","kk.kkkkkkkk.kk","k..kkkkkkkk..k","...kk....kk...","..kkk....kkk.."],{k:'#1c1c1c',r:'#e33'},5),
};
// ---------- input ----------
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0});
const joy={on:false,id:null,bx:0,by:0,x:0,y:0,R:55};
cv.addEventListener('pointerdown',e=>{if(joy.on)return;joy.on=true;joy.id=e.pointerId;joy.bx=joy.x=e.clientX;joy.by=joy.y=e.clientY;try{cv.setPointerCapture(e.pointerId)}catch(_){}} );
cv.addEventListener('pointermove',e=>{if(joy.on&&e.pointerId===joy.id){joy.x=e.clientX;joy.y=e.clientY}});
const jEnd=e=>{if(e.pointerId===joy.id){joy.on=false;joy.id=null}};
cv.addEventListener('pointerup',jEnd);cv.addEventListener('pointercancel',jEnd);
function inputVec(){let dx=0,dy=0;
 if(keys.a||keys.arrowleft)dx--;if(keys.d||keys.arrowright)dx++;if(keys.w||keys.arrowup)dy--;if(keys.s||keys.arrowdown)dy++;
 if(joy.on){const jx=joy.x-joy.bx,jy=joy.y-joy.by,l=Math.hypot(jx,jy);if(l>6){const m=Math.min(l,joy.R)/joy.R;dx=jx/l*m;dy=jy/l*m}}
 const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}return[dx,dy];}

// ---------- pools ----------
function pool(n,mk){const a=[];for(let i=0;i<n;i++){const o=mk();o.a=false;a.push(o)}return{a,get(){for(const o of a)if(!o.a){o.a=true;return o}return null}}}
const MAXE=220;
const enemies=pool(MAXE,()=>({x:0,y:0,hp:0,max:0,sp:0,r:0,dmg:0,xp:0,t:'',hit:0,boss:false,slow:0}));
const shots=pool(200,()=>({x:0,y:0,vx:0,vy:0,life:0,dmg:0,r:0,pierce:0,kind:''}));
const gems=pool(300,()=>({x:0,y:0,v:0}));
const pops=pool(60,()=>({x:0,y:0,txt:'',life:0,col:''}));
const fx=pool(40,()=>({x:0,y:0,r:0,life:0,max:0,kind:'',ang:0}));
// ---------- game state ----------
let G;
const ETYPES={
 chicken:{hp:6,sp:55,r:11,dmg:4,xp:1},
 rat:{hp:10,sp:75,r:14,dmg:5,xp:1},
 goblin:{hp:22,sp:60,r:13,dmg:7,xp:2},
 cow:{hp:45,sp:40,r:16,dmg:9,xp:3},
 skeleton:{hp:70,sp:62,r:13,dmg:12,xp:5},
 dragon:{hp:1500,sp:48,r:36,dmg:25,xp:60},
};
const WEAPONS={
 wind:{name:'Wind Strike',desc:'Magic missile at nearest foe',max:8},
 knives:{name:'Bronze knives',desc:'Throw knives where you move',max:8},
 scim:{name:'Rune scimitar',desc:'Wide slash in front of you',max:8},
 cannon:{name:'Dwarf multicannon',desc:'Deploys a turret that fires around',max:6},
 prayer:{name:'Smite aura',desc:'Holy aura damages nearby foes',max:6},
 barrage:{name:'Ice Barrage',desc:'Freezing AoE blast on a foe',max:6},
};
const PASSIVES={
 hp:{name:'Prayer potion... er, Super restore',desc:'+20 max HP and heal',max:5},
 spd:{name:'Graceful outfit',desc:'+10% move speed',max:5},
 mag:{name:'Ring of wealth',desc:'+40% XP pickup range',max:4},
 str:{name:'Super strength',desc:'+15% damage',max:5},
};
PASSIVES.hp.name='Super restore';
function newGame(){
 G={t:0,kills:0,lvl:1,xp:0,next:5,p:{x:0,y:0,hp:100,max:100,sp:150,face:[1,0],inv:0},w:{wind:1},pas:{},cd:{},cannons:[],spawnT:0,bossNext:180,paused:false,over:false,totalXp:0,shake:0};
 
 enemies.a.forEach(o=>o.a=false);shots.a.forEach(o=>o.a=false);gems.a.forEach(o=>o.a=false);pops.a.forEach(o=>o.a=false);fx.a.forEach(o=>o.a=false);
}
function dmgMul(){return 1+0.15*(G.pas.str||0)}
function pop(x,y,txt,col){const o=pops.get();if(o){o.x=x;o.y=y;o.txt=txt;o.life=1;o.col=col||'#fff'}}
function spawn(t,boss){const e=enemies.get();if(!e)return;const T=ETYPES[t],a=Math.random()*6.283,d=Math.max(W,H)*0.6+40;
 const sc=1+G.t/90;e.x=G.p.x+Math.cos(a)*d;e.y=G.p.y+Math.sin(a)*d;e.t=t;e.max=e.hp=T.hp*(boss?1+G.t/300:sc);e.sp=T.sp*(1+Math.min(G.t/600,0.5));e.r=T.r;e.dmg=T.dmg*(1+G.t/400);e.xp=T.xp;e.boss=!!boss;e.hit=0;e.slow=0;}
function hurt(e,d){d*=dmgMul();e.hp-=d;e.hit=0.1;pop(e.x,e.y-e.r,Math.round(d)+'', '#fff');if(e.hp<=0)kill(e)}
function kill(e){e.a=false;G.kills++;const n=e.boss?12:1;for(let i=0;i<n;i++){const g=gems.get();if(g){g.x=e.x+(Math.random()-.5)*(e.boss?60:4);g.y=e.y+(Math.random()-.5)*(e.boss?60:4);g.v=e.boss?5:e.xp}}
 if(e.boss){pop(e.x,e.y-50,'Boss slain!','#ff981f');G.shake=0.5}}
function nearest(x,y,maxd){let best=null,bd=maxd*maxd;for(const e of enemies.a){if(!e.a)continue;const d=(e.x-x)**2+(e.y-y)**2;if(d<bd){bd=d;best=e}}return best}
function fire(x,y,ang,sp,dmg,r,life,pierce,kind){const s=shots.get();if(!s)return;s.x=x;s.y=y;s.vx=Math.cos(ang)*sp;s.vy=Math.sin(ang)*sp;s.dmg=dmg;s.r=r;s.life=life;s.pierce=pierce;s.kind=kind}
function addFx(x,y,r,life,kind,ang){const f=fx.get();if(f){f.x=x;f.y=y;f.r=r;f.life=f.max=life;f.kind=kind;f.ang=ang||0}}

function weapons(dt){const p=G.p,w=G.w,cd=G.cd;
 for(const k in w){cd[k]=(cd[k]||0)-dt}
 if(w.wind&&cd.wind<=0){const L=w.wind;const n=1+Math.floor(L/3);for(let i=0;i<n;i++){const e=nearest(p.x,p.y,500);if(!e)break;fire(p.x,p.y,Math.atan2(e.y-p.y,e.x-p.x)+(i-(n-1)/2)*0.25,380,8+L*3,6,1.6,0,'wind')}cd.wind=Math.max(0.35,1.1-L*0.08)}
 if(w.knives&&cd.knives<=0){const L=w.knives,n=1+Math.floor(L/2),a=Math.atan2(p.face[1],p.face[0]);for(let i=0;i<n;i++)fire(p.x,p.y,a+(i-(n-1)/2)*0.18,480,6+L*2,4,1,Math.floor(L/4),'knife');cd.knives=Math.max(0.3,0.8-L*0.05)}
 if(w.scim&&cd.scim<=0){const L=w.scim,a=Math.atan2(p.face[1],p.face[0]),R=70+L*8;addFx(p.x,p.y,R,0.2,'slash',a);
  for(const e of enemies.a){if(!e.a)continue;const dx=e.x-p.x,dy=e.y-p.y,d=Math.hypot(dx,dy);if(d<R+e.r){let da=Math.abs(((Math.atan2(dy,dx)-a+9.42)%6.283)-3.14);if(da<1.1)hurt(e,14+L*6)}}
  if(L>=5){addFx(p.x,p.y,R,0.2,'slash',a+Math.PI);for(const e of enemies.a){if(!e.a)continue;const dx=e.x-p.x,dy=e.y-p.y,d=Math.hypot(dx,dy);if(d<R+e.r){let da=Math.abs(((Math.atan2(dy,dx)-a-Math.PI+9.42)%6.283)-3.14);if(da<1.1)hurt(e,14+L*6)}}}
  cd.scim=Math.max(0.6,1.4-L*0.1)}
 if(w.cannon){const L=w.cannon;if(cd.cannon<=0){G.cannons.push({x:p.x,y:p.y,life:8+L,ft:0,ang:0});if(G.cannons.length>1+Math.floor(L/3))G.cannons.shift();cd.cannon=10}
  for(const c of G.cannons){c.life-=dt;c.ft-=dt;c.ang+=dt*4;if(c.ft<=0){const e=nearest(c.x,c.y,320);if(e){c.ang=Math.atan2(e.y-c.y,e.x-c.x);fire(c.x,c.y,c.ang,420,10+L*4,5,0.9,0,'ball')}c.ft=Math.max(0.15,0.45-L*0.05)}}
  G.cannons=G.cannons.filter(c=>c.life>0)}
 if(w.prayer){const L=w.prayer,R=55+L*12;if(cd.prayer<=0){for(const e of enemies.a){if(e.a&&(e.x-p.x)**2+(e.y-p.y)**2<(R+e.r)**2)hurt(e,4+L*2.5)}cd.prayer=0.5}}
 if(w.barrage&&cd.barrage<=0){const L=w.barrage,e=nearest(p.x,p.y,420);if(e){const R=60+L*10,x=e.x,y=e.y;addFx(x,y,R,0.4,'ice');for(const o of enemies.a){if(o.a&&(o.x-x)**2+(o.y-y)**2<(R+o.r)**2){o.slow=2;hurt(o,18+L*7)}}}cd.barrage=Math.max(1.5,3.5-L*0.3)}
}
function update(dt){
 const p=G.p;G.t+=dt;
 const[dx,dy]=inputVec();const sp=p.sp*(1+0.1*(G.pas.spd||0));p.x+=dx*sp*dt;p.y+=dy*sp*dt;if(dx||dy){const l=Math.hypot(dx,dy);p.face=[dx/l,dy/l]}
 p.moving=!!(dx||dy);
 // spawn
 G.spawnT-=dt;const rate=Math.max(0.12,0.9-G.t/150);
 if(G.spawnT<=0){G.spawnT=rate;const n=1+Math.floor(G.t/60);const pool_=G.t<40?['chicken','rat']:G.t<100?['chicken','rat','goblin']:G.t<200?['rat','goblin','cow']:['goblin','cow','skeleton','skeleton'];for(let i=0;i<n;i++)spawn(pool_[Math.random()*pool_.length|0])}
 if(G.t>=G.bossNext){spawn('dragon',true);G.bossNext+=180;pop(p.x,p.y-60,'A dragon approaches!','#f33')}
 // enemies
 let hitSum=0;const live=[];
 for(const e of enemies.a){if(!e.a)continue;live.push(e);e.hit-=dt;e.slow-=dt;const ex=p.x-e.x,ey=p.y-e.y,d=Math.hypot(ex,ey)||1;
  if(d>Math.max(W,H)*1.2&&!e.boss){const a=Math.random()*6.283,r=Math.max(W,H)*0.6;e.x=p.x+Math.cos(a)*r;e.y=p.y+Math.sin(a)*r;continue}
  const s=e.sp*(e.slow>0?0.4:1);e.x+=ex/d*s*dt;e.y+=ey/d*s*dt;if(d<e.r+12)hitSum+=e.dmg}
 // simple separation (cheap: neighbors in grid)
 const cell=40,grid=new Map();for(const e of live){const k=((e.x/cell)|0)*7919+((e.y/cell)|0);let b=grid.get(k);if(!b)grid.set(k,b=[]);b.push(e)}
 for(const b of grid.values())for(let i=0;i<b.length;i++)for(let j=i+1;j<b.length;j++){const A=b[i],B=b[j],x=B.x-A.x,y=B.y-A.y,d=Math.hypot(x,y)||1,m=A.r+B.r;if(d<m){const k=(m-d)/d*0.5;A.x-=x*k;A.y-=y*k;B.x+=x*k;B.y+=y*k}}
 if(hitSum&&p.inv<=0){p.hp-=hitSum*0.25;p.inv=0.25;G.shake=0.15;pop(p.x,p.y-25,'-'+Math.round(hitSum*0.25),'#f44')}p.inv-=dt;
 if(p.hp<=0){gameOver();return}
 weapons(dt);
 // shots
 for(const s of shots.a){if(!s.a)continue;s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;if(s.life<=0){s.a=false;continue}
  for(const e of live){if(!e.a)continue;if((e.x-s.x)**2+(e.y-s.y)**2<(e.r+s.r)**2){hurt(e,s.dmg);if(s.pierce--<=0){s.a=false;break}}}}
 // gems
 const mag=70*(1+0.4*(G.pas.mag||0));
 for(const g of gems.a){if(!g.a)continue;const x=p.x-g.x,y=p.y-g.y,d=Math.hypot(x,y);if(d<mag){g.x+=x/d*400*dt;g.y+=y/d*400*dt}if(d<16){g.a=false;gainXp(g.v)}}
 for(const o of pops.a)if(o.a){o.life-=dt;o.y-=30*dt;if(o.life<=0)o.a=false}
 for(const f of fx.a)if(f.a){f.life-=dt;if(f.life<=0)f.a=false}
 G.shake=Math.max(0,G.shake-dt);
 // OSRS-style xp drop
 if(G.xpDrop){G.xpDrop.life-=dt;if(G.xpDrop.life<=0)G.xpDrop=null}
}
function gainXp(v){G.xp+=v;G.totalXp+=v*10;G.xpDrop={v:(G.xpDrop?G.xpDrop.v:0)+v*10,life:1.2};if(G.xp>=G.next){G.xp-=G.next;G.lvl++;G.next=Math.floor(5+G.lvl*4+G.lvl*G.lvl*0.4);levelUp()}}
function levelUp(){G.paused=true;const opts=[];
 for(const k in WEAPONS){const L=G.w[k]||0;if(L<WEAPONS[k].max)opts.push({k,type:'w',L})}
 for(const k in PASSIVES){const L=G.pas[k]||0;if(L<PASSIVES[k].max)opts.push({k,type:'p',L})}
 for(let i=opts.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[opts[i],opts[j]]=[opts[j],opts[i]]}
 const box=document.getElementById('choices');box.innerHTML='';
 const pick=opts.slice(0,3);if(!pick.length)pick.push({k:'hp',type:'heal'});
 for(const o of pick){const b=document.createElement('button');b.className='btn';const D=o.type==='w'?WEAPONS[o.k]:PASSIVES[o.k];
  b.innerHTML=o.type==='heal'?'Shark<small>Heal 50 HP</small>':`${D.name} ${o.L?'(Lv '+(o.L+1)+')':'<span style="color:#0f0">NEW</span>'}<small>${o.L?'Upgrade: more damage / faster':D.desc}</small>`;
  b.onclick=()=>{if(o.type==='w')G.w[o.k]=o.L+1;else if(o.type==='p'){G.pas[o.k]=o.L+1;if(o.k==='hp'){G.p.max+=20;G.p.hp=G.p.max}}else G.p.hp=Math.min(G.p.max,G.p.hp+50);
   document.getElementById('lvl').style.display='none';G.paused=false;last=performance.now()};box.appendChild(b)}
 document.getElementById('lvl').style.display='flex';}
function fmt(t){t=Math.floor(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')}
function loadBest(){try{return JSON.parse(localStorage.getItem('oss_best')||'{"t":0,"k":0}')}catch(_){return{t:0,k:0}}}
function gameOver(){G.over=true;const b=loadBest();const nb={t:Math.max(b.t,G.t),k:Math.max(b.k,G.kills)};try{localStorage.setItem('oss_best',JSON.stringify(nb))}catch(_){}
 document.getElementById('stats').innerHTML=`Survived ${fmt(G.t)} · Kills ${G.kills} · Level ${G.lvl}<br>Best: ${fmt(nb.t)} · ${nb.k} kills`;document.getElementById('over').style.display='flex'}
// ---------- render ----------
function drawGround(cx,cy){ctx.fillStyle='#4d6b2a';ctx.fillRect(0,0,W,H);const T=64,ox=-((cx%T)+T)%T,oy=-((cy%T)+T)%T;
 for(let y=oy-T;y<H+T;y+=T)for(let x=ox-T;x<W+T;x+=T){const gx=Math.floor((x+cx)/T),gy=Math.floor((y+cy)/T),h=(gx*73856093^gy*19349663)>>>0;
  if(h%5===0){ctx.fillStyle='#45612a';ctx.fillRect(x,y,T,T)}if(h%11===0){ctx.fillStyle='#3a5220';ctx.fillRect(x+20,y+30,4,8);ctx.fillRect(x+26,y+28,3,10)}
  if(h%37===0){ctx.fillStyle='#7a7a6e';ctx.fillRect(x+10,y+10,14,10);ctx.fillStyle='#5a5a50';ctx.fillRect(x+12,y+18,12,3)}
  if(h%53===0){ctx.fillStyle='#5a3a1a';ctx.fillRect(x+30,y+30,6,14);ctx.fillStyle='#2f5a1a';ctx.beginPath();ctx.arc(x+33,y+24,14,0,6.283);ctx.fill()}}}
function txt(s,x,y,col,size,align){ctx.font=`bold ${size||14}px Verdana,sans-serif`;ctx.textAlign=align||'left';ctx.fillStyle='#000';ctx.fillText(s,x+1,y+1);ctx.fillStyle=col||'#ff0';ctx.fillText(s,x,y)}
function panel(x,y,w,h){ctx.fillStyle='#4a3f30';ctx.fillRect(x,y,w,h);ctx.strokeStyle='#2a2218';ctx.lineWidth=3;ctx.strokeRect(x,y,w,h);ctx.strokeStyle='#7a6a4f';ctx.lineWidth=1;ctx.strokeRect(x+3,y+3,w-6,h-6)}
function render(){const p=G.p;let sx=0,sy=0;if(G.shake>0){sx=(Math.random()-.5)*8;sy=(Math.random()-.5)*8}
 const cx=p.x-W/2+sx,cy=p.y-H/2+sy;drawGround(cx,cy);ctx.save();ctx.translate(-cx,-cy);
 if(G.w.prayer){const R=55+G.w.prayer*12;ctx.fillStyle='rgba(255,230,120,0.12)';ctx.beginPath();ctx.arc(p.x,p.y,R,0,6.283);ctx.fill();ctx.strokeStyle='rgba(255,220,90,0.5)';ctx.lineWidth=2;ctx.stroke()}
 for(const g of gems.a)if(g.a){ctx.fillStyle=g.v>=5?'#e33':g.v>=3?'#3c3':'#4af';ctx.beginPath();ctx.moveTo(g.x,g.y-6);ctx.lineTo(g.x+4,g.y);ctx.lineTo(g.x,g.y+6);ctx.lineTo(g.x-4,g.y);ctx.fill()}
 for(const c of G.cannons){ctx.fillStyle='#3a3a3a';ctx.fillRect(c.x-10,c.y+2,20,6);ctx.fillStyle='#222';ctx.beginPath();ctx.arc(c.x,c.y,9,0,6.283);ctx.fill();ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.ang);ctx.fillStyle='#555';ctx.fillRect(0,-3,16,6);ctx.restore()}
 for(const e of enemies.a){if(!e.a||Math.abs(e.x-p.x)>W/2+80||Math.abs(e.y-p.y)>H/2+80)continue;const s=SPR[e.t];
  ctx.fillStyle='rgba(0,0,0,0.25)';ctx.beginPath();ctx.ellipse(e.x,e.y+e.r*0.8,e.r,e.r*0.35,0,0,6.283);ctx.fill();
  const flip=p.x<e.x;ctx.save();ctx.translate(e.x,e.y);if(flip)ctx.scale(-1,1);ctx.drawImage(s,-s.width/2,-s.height/2);if(e.hit>0){ctx.globalCompositeOperation='source-atop';}ctx.restore();
  if(e.hit>0){ctx.fillStyle='rgba(255,40,40,0.35)';ctx.fillRect(e.x-s.width/2,e.y-s.height/2,s.width,s.height)}
  if(e.slow>0){ctx.fillStyle='rgba(120,200,255,0.35)';ctx.fillRect(e.x-s.width/2,e.y-s.height/2,s.width,s.height)}
  if(e.hp<e.max){const bw=e.boss?80:28;ctx.fillStyle='#c00';ctx.fillRect(e.x-bw/2,e.y-s.height/2-8,bw,5);ctx.fillStyle='#0c0';ctx.fillRect(e.x-bw/2,e.y-s.height/2-8,bw*Math.max(0,e.hp/e.max),5)}}
 // player
 const ps=SPR.player,bob=p.moving?Math.sin(G.t*14)*1.5:0;ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(p.x,p.y+18,12,4,0,0,6.283);ctx.fill();
 ctx.save();ctx.translate(p.x,p.y+bob);if(p.face[0]<0)ctx.scale(-1,1);if(p.inv>0&&(G.t*20|0)%2)ctx.globalAlpha=0.5;ctx.drawImage(ps,-ps.width/2,-ps.height/2);
 ctx.fillStyle='#bbb';ctx.fillRect(14,-6,3,16);ctx.fillStyle='#7cf';ctx.fillRect(13,-9,5,4);ctx.restore();
 for(const s of shots.a){if(!s.a)continue;if(s.kind==='wind'){ctx.fillStyle='#cfefff';ctx.beginPath();ctx.arc(s.x,s.y,6,0,6.283);ctx.fill();ctx.fillStyle='#7cc4ff';ctx.beginPath();ctx.arc(s.x-s.vx*0.02,s.y-s.vy*0.02,4,0,6.283);ctx.fill()}
  else if(s.kind==='knife'){ctx.save();ctx.translate(s.x,s.y);ctx.rotate(Math.atan2(s.vy,s.vx));ctx.fillStyle='#b8733a';ctx.fillRect(-6,-1.5,12,3);ctx.fillStyle='#5a3a1a';ctx.fillRect(-9,-2,4,4);ctx.restore()}
  else{ctx.fillStyle='#222';ctx.beginPath();ctx.arc(s.x,s.y,4,0,6.283);ctx.fill()}}
 for(const f of fx.a){if(!f.a)continue;const k=f.life/f.max;if(f.kind==='slash'){ctx.strokeStyle=`rgba(120,230,255,${k})`;ctx.lineWidth=8*k+2;ctx.beginPath();ctx.arc(f.x,f.y,f.r*0.8,f.ang-1.1,f.ang+1.1);ctx.stroke()}
  else{ctx.fillStyle=`rgba(170,220,255,${0.5*k})`;ctx.beginPath();ctx.arc(f.x,f.y,f.r*(1.2-k*0.4),0,6.283);ctx.fill();ctx.strokeStyle=`rgba(255,255,255,${k})`;ctx.lineWidth=2;ctx.stroke()}}
 for(const o of pops.a)if(o.a){ctx.globalAlpha=Math.min(1,o.life*2);txt(o.txt,o.x,o.y,o.col,12,'center');ctx.globalAlpha=1}
 ctx.restore();
 // HUD
 const top=(window.visualViewport?0:0)+8+ (parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sat'))||0);
 panel(8,top,W-16,52);
 ctx.fillStyle='#000';ctx.fillRect(16,top+10,W-120,12);ctx.fillStyle='#b00';ctx.fillRect(16,top+10,W-120,12);ctx.fillStyle='#0a0';ctx.fillRect(16,top+10,(W-120)*Math.max(0,p.hp/p.max),12);
 txt(`${Math.ceil(Math.max(0,p.hp))}/${p.max}`,16+(W-120)/2,top+21,'#fff',11,'center');
 ctx.fillStyle='#000';ctx.fillRect(16,top+28,W-120,8);ctx.fillStyle='#ff981f';ctx.fillRect(16,top+28,(W-120)*Math.min(1,G.xp/G.next),8);
 txt('Lv '+G.lvl,16,top+50,'#ff0',12);txt('Kills '+G.kills,(W-90)/2,top+50,'#ff0',12,'center');
 txt(fmt(G.t),W-20,top+26,'#fff',18,'right');
 if(G.xpDrop){const k=G.xpDrop.life/1.2;ctx.globalAlpha=Math.min(1,k*2);txt('+'+G.xpDrop.v+' xp',W-20,top+80-(1-k)*20,'#fff',14,'right');ctx.globalAlpha=1}
 txt('Total XP: '+G.totalXp.toLocaleString(),W-20,top+50,'#fff',11,'right');
 // joystick
 if(joy.on){ctx.strokeStyle='rgba(255,230,150,0.6)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(joy.bx,joy.by,joy.R,0,6.283);ctx.stroke();let jx=joy.x-joy.bx,jy=joy.y-joy.by,l=Math.hypot(jx,jy);if(l>joy.R){jx=jx/l*joy.R;jy=jy/l*joy.R}
  ctx.fillStyle='rgba(255,200,60,0.7)';ctx.beginPath();ctx.arc(joy.bx+jx,joy.by+jy,22,0,6.283);ctx.fill()}
 else if(G.t<6){txt('Touch & drag to move',W/2,H-60,'#ff0',16,'center')}
}
let last=performance.now(),running=false;
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;if(running&&!G.paused&&!G.over)update(dt);if(G)render();requestAnimationFrame(loop)}
function start(){newGame();['menu','over','lvl'].forEach(id=>document.getElementById(id).style.display='none');running=true;last=performance.now()}
const b=loadBest();document.getElementById('best').textContent=b.t?`Best: ${fmt(b.t)} · ${b.k} kills`:'';
document.getElementById('startBtn').onclick=start;document.getElementById('againBtn').onclick=start;
newGame();document.getElementById('menu').style.display='flex';requestAnimationFrame(loop);
window.__game={get G(){return G},gainXp,start};
})();
</script></body></html>
