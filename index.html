 for(const s of shots.a){if(!s.a||s.kind==='wind')continue;if(s.kind==='knife'){ctx.save();ctx.translate(s.x,s.y);ctx.rotate(Math.atan2(s.vy,s.vx));ctx.drawImage(SPR.knife.c,-12,-5,24,10);ctx.restore()}else ctx.drawImage(SPR.ball.c,s.x-6,s.y-6,12,12)}
 for(const o of pops.a)if(o.a){ctx.globalAlpha=Math.min(1,o.life*2);txt(o.txt,o.x,o.y,o.col,12,'center');ctx.globalAlpha=1}
 ctx.restore();
 // HUD
 const top=8;panel(8,top,W-16,52);
 bar(18,top+11,W-120,13,Math.max(0,p.hp/p.max),'#5f5','#0a8a0a');txt(`${Math.ceil(Math.max(0,p.hp))}/${p.max}`,18+(W-120)/2,top+22,'#fff',11,'center');
 bar(18,top+29,W-120,8,Math.min(1,G.xp/G.next),'#ffc060','#d86a00');
 txt('Lv '+G.lvl,18,top+50,'#ff0',12);txt('Kills '+G.kills,(W-90)/2,top+50,'#ff981f',12,'center');txt(fmt(G.t),W-22,top+28,'#fff',19,'right');
 // slot bar
 const sy2=top+58,S=26;panel(8,sy2,W-16,52);const wk=Object.keys(G.w),pk=Object.keys(G.pas),mk2=Object.keys(G.mega);
 txt(`Weapons ${wk.length}/${WSLOTS}`,16,sy2+15,wk.length>=WSLOTS?'#ff6040':'#ff0',10);let x=16;
 for(let i=0;i<WSLOTS;i++){slot(x,sy2+19,S,wk[i],G.w[wk[i]],null,!wk[i]);x+=S+3}
 x+=8;txt(`Passives ${pk.length}/${PSLOTS}`,x,sy2+15,pk.length>=PSLOTS?'#ff6040':'#ff0',10);
 for(let i=0;i<PSLOTS;i++){slot(x,sy2+19,S,pk[i],G.pas[pk[i]],null,!pk[i]);x+=S+3}
 x+=8;txt('Mega +',x,sy2+15,'#ffa500',10);if(!mk2.length)slot(x,sy2+19,S,null,0,'#ffa500',true);
 for(const k of mk2){if(x+S>W-12)break;slot(x,sy2+19,S,k,G.mega[k]>1?'x'+G.mega[k]:'', '#ffa500',false);x+=S+3}
 // skills strip
 let sx2=12;for(const k of SKILLS){ctx.drawImage(ICON[k].c,sx2,H-30,18,18);const t=''+sLvl(k);txt(t,sx2+20,H-16,SKCOL[k],12);ctx.font='bold 12px "Trebuchet MS",Verdana';sx2+=24+ctx.measureText(t).width+6}
 if(G.banner){ctx.globalAlpha=Math.min(1,G.banner.life);txt(G.banner.txt,W/2,sy2+72,G.banner.col||(G.banner.purple?'#ffa500':'#ff981f'),G.banner.purple?14:12,'center');ctx.globalAlpha=1}
 let dy=0;for(const k in G.drops){const d=G.drops[k],o=(1.4-d.life)*12;ctx.globalAlpha=Math.min(1,d.life*2);ctx.drawImage(ICON[k].c,W-30,sy2+82+dy-o,16,16);txt('+'+Math.round(d.v)+' '+k,W-34,sy2+95+dy-o,'#fff',13,'right');ctx.globalAlpha=1;dy+=19}
 orb(W-30,H-62,p.hp/p.max,'#ff6a5a','#8a0a0a',''+Math.ceil(Math.max(0,p.hp)),'Hitpoints');
 orb(W-30,H-106,1,'#9ae8ff','#1a6a9a',''+sLvl('Prayer'),'Prayer');
 // joystick
 if(joy.on){let jx=joy.x-joy.bx,jy=joy.y-joy.by,l=Math.hypot(jx,jy);if(l>joy.R){jx=jx/l*joy.R;jy=jy/l*joy.R}
  const q=ctx.createRadialGradient(joy.bx,joy.by,10,joy.bx,joy.by,joy.R);q.addColorStop(0,'rgba(60,50,35,.15)');q.addColorStop(1,'rgba(60,50,35,.45)');ctx.fillStyle=q;ctx.beginPath();ctx.arc(joy.bx,joy.by,joy.R,0,6.283);ctx.fill();ctx.strokeStyle='rgba(230,200,120,.7)';ctx.lineWidth=2.5;ctx.stroke();
  const k=ctx.createRadialGradient(joy.bx+jx-6,joy.by+jy-6,3,joy.bx+jx,joy.by+jy,22);k.addColorStop(0,'#ffe9a0');k.addColorStop(1,'#b07a20');ctx.fillStyle=k;ctx.beginPath();ctx.arc(joy.bx+jx,joy.by+jy,21,0,6.283);ctx.fill();ctx.strokeStyle='#3a2a10';ctx.lineWidth=2;ctx.stroke()}
 else if(G.t<6)txt('Touch & drag to move',W/2,H-70,'#ff0',16,'center');
}
let last=performance.now(),running=false;
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;if(running&&!G.paused&&!G.over)update(dt);if(G)render();requestAnimationFrame(loop)}
function start(){newGame();['menu','over','lvl'].forEach(id=>document.getElementById(id).style.display='none');running=true;last=performance.now()}
const b=loadBest();document.getElementById('best').textContent=b.t?`Best: ${fmt(b.t)} · ${b.k} kills`:'';
document.getElementById('startBtn').onclick=start;document.getElementById('againBtn').onclick=start;
newGame();document.getElementById('menu').style.display='flex';requestAnimationFrame(loop);
window.__game={grantMega,levelUp,get G(){return G},gainXp,start,SK,XPT,sLvl};
})();
